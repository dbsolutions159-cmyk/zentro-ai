<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,Segoe UI;
background:#0b1120;
color:white;
-webkit-tap-highlight-color: transparent;
}

/* HEADER */
header{
padding:18px;
display:flex;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,0.05);
}

/* GLASS */
.glass{
background:rgba(30,41,59,0.6);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,0.08);
}

/* LAYOUT */
.container{
display:flex;
height:85vh;
}

/* CHAT */
.chat{
flex:3;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
background:#1e293b;
padding:12px;
border-radius:10px;
margin:8px 0;
max-width:65%;
}

.user{
background:#22d3ee;
color:black;
margin-left:auto;
}

/* INPUT */
.input-box{
display:flex;
padding:10px;
border-top:1px solid rgba(255,255,255,0.05);
}

.input-box input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#1e293b;
color:white;
outline:none;
}

.input-box button{
margin-left:10px;
padding:12px 18px;
background:#22d3ee;
border:none;
border-radius:10px;
cursor:pointer;
}

/* PANEL */
.panel{
flex:1;
padding:20px;
}

/* PROFILE */
.profile{
padding:15px;
border-radius:12px;
margin-bottom:15px;
text-align:center;
}

.profile img{
width:60px;
height:60px;
border-radius:50%;
}

.profile-name{
font-weight:bold;
margin-top:8px;
}

.badge{
font-size:12px;
opacity:0.7;
}

/* GOOGLE */
.google-btn{
width:100%;
padding:12px;
background:white;
color:black;
border-radius:10px;
cursor:pointer;
margin-bottom:10px;
}

/* LOGOUT */
#logoutBtn{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#ef4444;
color:white;
cursor:pointer;
margin-top:10px;
display:none;
transition:0.3s;
}

#logoutBtn:hover{
background:#dc2626;
transform:scale(1.05);
}

/* SOCIAL */
.social{
margin-top:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.social a{text-decoration:none;}

.social button{
width:100%;
background:#1e293b;
color:white;
padding:10px;
border-radius:8px;
border:none;
cursor:pointer;
}

/* DISABLED */
.disabled{
opacity:0.4;
pointer-events:none;
}

/* MOBILE RESPONSIVE */
@media (max-width: 768px){

  .container{
    flex-direction:column;
    height:auto;
  }

  .chat{
    width:100%;
    height:65vh;
  }

  .messages{
    padding:15px;
  }

  .panel{
    width:100%;
    margin-top:10px;
  }

  .input-box{
    position:sticky;
    bottom:0;
  }

  .msg{
    max-width:85%;
  }

  button{
    font-size:14px;
  }

  input{
    font-size:14px;
  }

}
</style>
</head>

<body>

<header>
<div>
Zentro AI <br>
<small style="color:#22d3ee">Powered by DB Solutions</small>
</div>
<div>Smart Hiring</div>
</header>

<div class="container">

<!-- CHAT -->
<div class="chat">

<div id="chat" class="messages glass disabled">
<div class="msg">👋 Welcome to Zentro</div>
<div class="msg">🔒 Login to unlock AI hiring</div>
</div>

<div class="input-box glass">
<input id="messageInput" placeholder="Login required..." disabled>
<button onclick="sendMessage()">Send</button>
</div>

</div>

<!-- PANEL -->
<div class="panel glass">

<div id="profileSection"></div>

<button class="google-btn" onclick="googleLogin()">
Continue with Google 🚀
</button>

<button id="logoutBtn">Logout</button>

<div>
<input type="file" id="fileInput">
<button onclick="uploadResume()">Upload Resume</button>
</div>

<div class="social">
<a href="https://www.facebook.com/share/1GhLkg5Y2k/" target="_blank">
<button>📘 Facebook</button>
</a>

<a href="https://www.linkedin.com/in/dharmesh-band-1b7b97134" target="_blank">
<button>💼 LinkedIn</button>
</a>

<a href="https://whatsapp.com/channel/0029Vb0Cqmf1CYoYmdhbJd3F" target="_blank">
<button>🟢 WhatsApp Channel</button>
</a>
</div>

</div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>

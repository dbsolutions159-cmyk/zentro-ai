<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,Segoe UI;
background:#0b1120;
color:white;
}

/* HEADER */
header{
padding:12px 16px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.menu{
font-size:20px;
cursor:pointer;
}

/* CHAT */
.chat{
height:90vh;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:#1e293b;
padding:10px;
border-radius:10px;
margin:6px 0;
max-width:80%;
}

.user{
background:#22d3ee;
color:black;
margin-left:auto;
}

/* INPUT */
.input-box{
display:flex;
padding:10px;
border-top:1px solid rgba(255,255,255,0.1);
}

.input-box input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#1e293b;
color:white;
}

.input-box button{
margin-left:10px;
padding:12px 16px;
background:#22d3ee;
border:none;
border-radius:10px;
cursor:pointer;
}

/* UPLOAD BUTTON */
.upload-main{
margin:10px;
padding:12px;
text-align:center;
background:#1e293b;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.upload-main:hover{
background:#334155;
}

/* SIDEBAR (PRO) */
.sidebar{
position:fixed;
top:0;
left:-350px;
width:320px;
height:100%;
background:rgba(2,6,23,0.9);
backdrop-filter:blur(10px);
padding:20px;
transition:0.3s;
z-index:1000;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.sidebar.active{
left:0;
}

/* CLOSE BTN */
.close-btn{
font-size:20px;
cursor:pointer;
margin-bottom:10px;
}

/* PROFILE */
.profile{
text-align:center;
margin-bottom:20px;
}

.profile img{
width:70px;
border-radius:50%;
}

.profile h3{margin-top:10px}

/* BUTTONS */
.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.google{background:white;color:black;}
.logout{background:#ef4444;color:white;}

/* SOCIAL */
.social{
margin-top:20px;
}

.social a{
display:flex;
align-items:center;
gap:10px;
padding:10px;
margin-top:10px;
background:#1e293b;
border-radius:10px;
text-decoration:none;
color:white;
transition:0.2s;
}

.social a:hover{
background:#334155;
}

.social img{
width:20px;
}
</style>
</head>

<body>

<header>
<div class="menu" onclick="toggleMenu()">☰</div>
<div>
Zentro AI <br>
<small style="color:#22d3ee">Powered by DB Solutions</small>
</div>
<div>Smart Hiring</div>
</header>

<!-- CHAT -->
<div class="chat">

<div id="chat" class="messages">
<div class="msg">👋 Welcome to Zentro</div>
<div class="msg">🤖 Upload resume or ask anything</div>
</div>

<label class="upload-main">
📄 Upload Resume
<input type="file" id="fileInput" hidden onchange="uploadResume()">
</label>

<div class="input-box">
<input id="messageInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

<div class="close-btn" onclick="toggleMenu()">✕</div>

<div class="profile" id="profileSection"></div>

<button class="btn google" onclick="googleLogin()">Continue with Google 🚀</button>
<button class="btn logout" onclick="logout()">Logout</button>

<div class="social">

<a href="https://www.facebook.com/share/1GhLkg5Y2k/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
Facebook
</a>

<a href="https://www.linkedin.com/in/dharmesh-band-1b7b97134" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png">
LinkedIn
</a>

<a href="https://whatsapp.com/channel/0029Vb0Cqmf1CYoYmdhbJd3F" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
WhatsApp
</a>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}
</script>

<script type="module" src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,Segoe UI;
background:#0b1120;
color:white;
}

/* HEADER */
header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.menu{
font-size:22px;
cursor:pointer;
}

/* CHAT */
.chat{
height:90vh;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
background:#1e293b;
padding:10px;
border-radius:10px;
margin:6px 0;
max-width:80%;
}

.user{
background:#22d3ee;
color:black;
margin-left:auto;
}

/* INPUT */
.input-box{
display:flex;
padding:10px;
border-top:1px solid rgba(255,255,255,0.1);
}

.input-box input{
flex:1;
padding:12px;
border-radius:10px;
border:none;
background:#1e293b;
color:white;
}

.input-box button{
margin-left:10px;
padding:12px 16px;
background:#22d3ee;
border:none;
border-radius:10px;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-100%;
width:80%;
height:100%;
background:#020617;
padding:20px;
transition:0.3s;
z-index:1000;
}

.sidebar.active{
left:0;
}

/* PROFILE */
.profile{
text-align:center;
margin-bottom:20px;
}

.profile img{
width:70px;
border-radius:50%;
}

.profile h3{margin-top:10px}

.badge{
font-size:12px;
opacity:0.7;
}

/* BUTTONS */
.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.google{background:white;color:black;}
.logout{background:#ef4444;color:white;}

/* SOCIAL */
.social button{
background:#1e293b;
color:white;
}
</style>
</head>

<body>

<header>
<div class="menu" onclick="toggleMenu()">☰</div>
<div>
Zentro AI <br>
<small style="color:#22d3ee">Powered by DB Solutions</small>
</div>
<div>Smart Hiring</div>
</header>

<!-- CHAT -->
<div class="chat">

<div id="chat" class="messages">
<div class="msg">👋 Welcome to Zentro</div>
<div class="msg">🤖 Ask anything about jobs</div>
</div>

<div class="input-box">
<input id="messageInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

<div class="profile" id="profileSection"></div>

<button class="btn google" onclick="googleLogin()">Continue with Google 🚀</button>
<button class="btn logout" onclick="logout()">Logout</button>

<input type="file" id="fileInput">
<button class="btn" onclick="uploadResume()">Upload Resume</button>

<div class="social">
<button onclick="window.open('https://www.facebook.com/share/1GhLkg5Y2k/')">📘 Facebook</button>
<button onclick="window.open('https://www.linkedin.com/in/dharmesh-band-1b7b97134')">💼 LinkedIn</button>
<button onclick="window.open('https://whatsapp.com/channel/0029Vb0Cqmf1CYoYmdhbJd3F')">🟢 WhatsApp</button>
</div>

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}
</script>

<script type="module" src="app.js"></script>

</body>
</html>

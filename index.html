<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,Segoe UI;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
}

/* HEADER */
header{
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

.logo{
font-weight:bold;
font-size:18px;
}

.logo span{
color:#22d3ee;
}

/* CHAT */
.chat{
height:88vh;
display:flex;
flex-direction:column;
}

/* MESSAGES */
.messages{
flex:1;
overflow-y:auto;
padding:20px;
}

.msg{
padding:12px;
border-radius:12px;
margin:8px 0;
max-width:75%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(8px);
}

.user{
background:#22d3ee;
color:black;
margin-left:auto;
}

/* AI MESSAGE */
.ai{
border-left:3px solid #22d3ee;
}

/* INPUT */
.input-box{
display:flex;
padding:10px;
border-top:1px solid rgba(255,255,255,0.1);
}

.input-box input{
flex:1;
padding:14px;
border-radius:12px;
border:none;
background:rgba(255,255,255,0.05);
color:white;
}

.input-box button{
margin-left:10px;
padding:14px 18px;
background:#22d3ee;
border:none;
border-radius:12px;
cursor:pointer;
}

/* UPLOAD HERO */
.upload-main{
margin:15px;
padding:15px;
text-align:center;
background:linear-gradient(135deg,#22d3ee33,#22d3ee11);
border-radius:15px;
cursor:pointer;
transition:0.3s;
border:1px solid rgba(255,255,255,0.05);
}

.upload-main:hover{
transform:scale(1.02);
}

/* RESULT CARDS */
.cards{
display:flex;
gap:10px;
padding:10px;
overflow-x:auto;
}

.card{
min-width:150px;
padding:12px;
border-radius:12px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
}

.card span{
display:block;
margin-top:5px;
color:#22d3ee;
font-weight:bold;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-350px;
width:320px;
height:100%;
background:rgba(2,6,23,0.9);
backdrop-filter:blur(12px);
padding:20px;
transition:0.3s;
z-index:1000;
box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.sidebar.active{
left:0;
}

.close-btn{
cursor:pointer;
margin-bottom:10px;
}

/* PROFILE */
.profile{
text-align:center;
margin-bottom:20px;
}

.profile img{
width:70px;
border-radius:50%;
border:2px solid #22d3ee;
}

/* BUTTONS */
.btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.google{background:white;color:black;}
.logout{background:#ef4444;color:white;}

/* SOCIAL */
.social a{
display:flex;
align-items:center;
gap:10px;
padding:10px;
margin-top:10px;
background:rgba(255,255,255,0.05);
border-radius:10px;
text-decoration:none;
color:white;
}

.social img{width:20px;}

</style>
</head>

<body>

<header>
<div onclick="toggleMenu()">☰</div>
<div class="logo">Zentro <span>AI</span></div>
<div>🚀 Hiring</div>
</header>

<div class="chat">

<div id="chat" class="messages">
<div class="msg ai">👋 Welcome to Zentro AI</div>
<div class="msg ai">📄 Upload resume or ask anything</div>
</div>

<!-- RESULT CARDS -->
<div class="cards">
<div class="card">ATS Score <span>--</span></div>
<div class="card">Jobs <span>--</span></div>
<div class="card">Status <span>Ready</span></div>
</div>

<!-- UPLOAD -->
<label class="upload-main">
📄 Upload Resume (Click here)
<input type="file" hidden id="fileInput" onchange="uploadResume()">
</label>

<div class="input-box">
<input id="messageInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

<div class="close-btn" onclick="toggleMenu()">✕</div>

<div class="profile" id="profileSection"></div>

<button class="btn google" onclick="googleLogin()">Continue with Google 🚀</button>
<button class="btn logout" onclick="logout()">Logout</button>

<div class="social">

<a href="https://www.facebook.com/share/1GhLkg5Y2k/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png">
Facebook
</a>

<a href="https://www.linkedin.com/in/dharmesh-band-1b7b97134" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png">
LinkedIn
</a>

<a href="https://whatsapp.com/channel/0029Vb0Cqmf1CYoYmdhbJd3F" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
WhatsApp
</a>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}
</script>

<script type="module" src="app.js"></script>

</body>
</html>

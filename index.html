<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentro AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,Segoe UI;
background:linear-gradient(135deg,#020617,#0f172a);
color:white;
}

/* HEADER */
header{
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.menu{cursor:pointer;font-size:20px}

/* BRAND */
.brand{text-align:center}
.brand-title{font-size:18px;font-weight:bold}
.brand-title span{color:#22d3ee}
.brand-sub{
font-size:11px;
color:#22d3ee;
font-weight:600;
letter-spacing:1px;
}

/* CHAT */
.chat{height:88vh;display:flex;flex-direction:column}

.messages{
flex:1;
overflow-y:auto;
padding:15px;
}

.msg{
padding:10px;
border-radius:10px;
margin:6px 0;
max-width:75%;
background:rgba(255,255,255,0.05);
}

.user{
background:#22d3ee;
color:black;
margin-left:auto;
}

/* CARDS */
.cards{
display:flex;
gap:10px;
padding:10px;
overflow-x:auto;
}

.card{
min-width:120px;
padding:10px;
border-radius:10px;
background:rgba(255,255,255,0.05);
}

.card span{color:#22d3ee;font-weight:bold}

/* INPUT */
.input-box{
display:flex;
padding:10px;
border-top:1px solid rgba(255,255,255,0.1);
align-items:center;
}

/* ATTACH */
.attach-btn{
width:40px;height:40px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,0.08);
border-radius:10px;
margin-right:8px;
cursor:pointer;
}

.attach-btn:hover{
background:#22d3ee;
color:black;
}

/* INPUT */
.input-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.05);
color:white;
}

.input-box button{
margin-left:8px;
padding:12px 16px;
background:#22d3ee;
border:none;
border-radius:10px;
cursor:pointer;
}

/* SIDEBAR */
.sidebar{
position:fixed;
top:0;
left:-320px;
width:280px;
height:100%;
background:rgba(2,6,23,0.95);
padding:20px;
transition:0.3s;
}

.sidebar.active{left:0}

.close{cursor:pointer;margin-bottom:10px}

/* PROFILE */
.profile{text-align:center;margin-bottom:20px}

/* BUTTONS */
.btn{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.google{background:white;color:black}
.logout{background:#ef4444;color:white}

/* SOCIAL */
.social a{
display:flex;
align-items:center;
gap:10px;
padding:10px;
margin-top:10px;
background:rgba(255,255,255,0.05);
border-radius:10px;
text-decoration:none;
color:white;
}

.social img{width:18px}
</style>
</head>

<body>

<header>
<div class="menu" onclick="toggleMenu()">☰</div>

<div class="brand">
<div class="brand-title">Zentro <span>AI</span></div>
<div class="brand-sub">POWERED BY DB SOLUTIONS</div>
</div>

<div>🚀</div>
</header>

<div class="chat">

<div id="chat" class="messages">
<div class="msg">👋 Welcome to Zentro AI</div>
<div class="msg">📄 Upload resume or ask anything</div>
</div>

<div class="cards">
<div class="card">ATS <span id="ats">--</span></div>
<div class="card">Jobs <span>--</span></div>
<div class="card">Status <span>Ready</span></div>
</div>

<div class="input-box">

<label class="attach-btn">
📎
<input type="file" id="fileInput" hidden onchange="uploadResume()">
</label>

<input id="messageInput" placeholder="Ask anything...">

<button onclick="sendMessage()">Send</button>

</div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">

<div class="close" onclick="toggleMenu()">✕</div>

<div id="profileSection" class="profile"></div>

<button class="btn google" onclick="googleLogin()">Continue with Google</button>
<button class="btn logout" onclick="logout()">Logout</button>

<div class="social">

<a href="https://www.facebook.com/share/1GhLkg5Y2k/" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"> Facebook
</a>

<a href="https://www.linkedin.com/in/dharmesh-band-1b7b97134" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png"> LinkedIn
</a>

<a href="https://whatsapp.com/channel/0029Vb0Cqmf1CYoYmdhbJd3F" target="_blank">
<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"> WhatsApp
</a>

</div>

</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("active");
}
</script>

<script type="module" src="app.js"></script>

</body>
</html>
